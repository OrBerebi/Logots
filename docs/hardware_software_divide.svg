<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="800" viewBox="0 0 1350 800">
  <defs>
    <marker id="mi" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#D4680A"/>
    </marker>
    <marker id="mo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1565C0"/>
    </marker>
    <marker id="mg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#1B5E20"/>
    </marker>
    <marker id="mb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#7B3800"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1350" height="800" fill="#EEF2F7"/>

  <!-- TITLE BAR -->
  <rect x="0" y="0" width="1350" height="68" fill="#0D1B2A"/>
  <text x="675" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="white">Logots Robot — Hardware ↔ Software Interface Divide</text>
  <text x="675" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#90A8C0">The "divide" is the WiFi boundary — recording_module.py is the first point of software contact for all sensor data</text>

  <!-- COLUMN BACKGROUNDS -->
  <rect x="12"  y="76" width="282" height="708" rx="10" fill="#D6E8F8" stroke="#8BADD0" stroke-width="1.5"/>
  <rect x="302" y="76" width="246" height="708" rx="10" fill="#FEF0D6" stroke="#D8A050" stroke-width="1.5"/>
  <rect x="556" y="76" width="242" height="708" rx="10" fill="#D6F0DC" stroke="#80B890" stroke-width="1.5"/>
  <rect x="856" y="76" width="480" height="708" rx="10" fill="#EDE0F8" stroke="#A880CC" stroke-width="1.5"/>

  <!-- COLUMN HEADERS -->
  <rect x="12"  y="76" width="282" height="32" rx="8" fill="#1E4D7B"/>
  <text x="153" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">HARDWARE LAYER</text>

  <rect x="302" y="76" width="246" height="32" rx="8" fill="#8B4500"/>
  <text x="425" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">NETWORK DIVIDE</text>

  <rect x="556" y="76" width="242" height="32" rx="8" fill="#1B5E20"/>
  <text x="677" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">SOFTWARE LAYER</text>

  <rect x="856" y="76" width="480" height="32" rx="8" fill="#4A1080"/>
  <text x="1096" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">recording_module.py</text>

  <!-- =========================================================== -->
  <!-- ROW 1: AUDIO   yc = 163                                      -->
  <!-- =========================================================== -->
  <rect x="24" y="120" width="258" height="86" rx="8" fill="#1E4D7B"/>
  <text x="153" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Audio ESP32</text>
  <text x="153" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#A8D8F0">Mic · INMP441</text>
  <text x="153" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8" font-style="italic">esp32_audio.ino</text>

  <line x1="282" y1="163" x2="555" y2="163" stroke="#D4680A" stroke-width="2.5" marker-end="url(#mi)"/>
  <text x="425" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B3000">Continuous raw sound stream</text>
  <text x="425" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9B6030">16kHz · mono · live</text>

  <rect x="566" y="127" width="222" height="72" rx="8" fill="#1B5E20"/>
  <text x="677" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Receives live audio</text>
  <text x="677" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A8E6B0">Collects and buffers sound frames</text>

  <!-- =========================================================== -->
  <!-- ROW 2: IMU   yc = 267                                        -->
  <!-- =========================================================== -->
  <rect x="24" y="224" width="258" height="86" rx="8" fill="#1E4D7B"/>
  <text x="153" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">IMU ESP32</text>
  <text x="153" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#A8D8F0">Grove 9DoF IMU</text>
  <text x="153" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8" font-style="italic">imu_ypr_v6.ino</text>

  <line x1="282" y1="267" x2="555" y2="267" stroke="#D4680A" stroke-width="2.5" marker-end="url(#mi)"/>
  <text x="425" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B3000">Orientation angles, 50x/sec</text>
  <text x="425" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9B6030">yaw · pitch · roll · live</text>

  <rect x="566" y="231" width="222" height="72" rx="8" fill="#1B5E20"/>
  <text x="677" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Receives orientation data</text>
  <text x="677" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A8E6B0">Collects tilt &amp; rotation readings</text>

  <!-- =========================================================== -->
  <!-- ROW 3: VIDEO   yc = 373                                      -->
  <!-- =========================================================== -->
  <rect x="24" y="330" width="258" height="86" rx="8" fill="#1E4D7B"/>
  <text x="153" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Video ESP32</text>
  <text x="153" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#A8D8F0">Camera · OV3660</text>
  <text x="153" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8" font-style="italic">ESP32_CameraWebServer.ino</text>

  <line x1="282" y1="373" x2="555" y2="373" stroke="#D4680A" stroke-width="2.5" marker-end="url(#mi)"/>
  <text x="425" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B3000">Camera snapshot, 4x/sec</text>
  <text x="425" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9B6030">JPEG · 640x640 · on request</text>

  <rect x="566" y="337" width="222" height="72" rx="8" fill="#1B5E20"/>
  <text x="677" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Fetches camera snapshots</text>
  <text x="677" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A8E6B0">Collects and buffers live frames</text>

  <!-- =========================================================== -->
  <!-- INPUT COLLECTOR: 3 SW boxes fan into STAGING at y=236        -->
  <!-- Bus at x=826 (middle of gap between SW col and Pipeline col) -->
  <!-- =========================================================== -->
  <line x1="788" y1="163" x2="826" y2="163" stroke="#1B5E20" stroke-width="1.5"/>
  <line x1="788" y1="267" x2="826" y2="267" stroke="#1B5E20" stroke-width="1.5"/>
  <line x1="788" y1="373" x2="826" y2="373" stroke="#1B5E20" stroke-width="1.5"/>
  <line x1="826" y1="163" x2="826" y2="373" stroke="#1B5E20" stroke-width="1.5"/>
  <circle cx="826" cy="163" r="3.5" fill="#1B5E20"/>
  <circle cx="826" cy="267" r="3.5" fill="#1B5E20"/>
  <circle cx="826" cy="373" r="3.5" fill="#1B5E20"/>
  <line x1="826" y1="236" x2="869" y2="236" stroke="#1B5E20" stroke-width="2" marker-end="url(#mg)"/>

  <!-- =========================================================== -->
  <!-- SEPARATOR                                                     -->
  <!-- =========================================================== -->
  <line x1="12" y1="440" x2="848" y2="440" stroke="#999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="322" y="431" width="206" height="16" rx="4" fill="#DDD"/>
  <text x="425" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">SENSOR INPUTS above  |  MOTOR OUTPUTS below</text>

  <!-- =========================================================== -->
  <!-- MOTORS ESP32   motor yc=519  audio yc=609                    -->
  <!-- =========================================================== -->
  <rect x="24" y="454" width="258" height="224" rx="8" fill="#1E4D7B"/>
  <text x="153" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Motors ESP32</text>

  <rect x="34" y="478" width="238" height="82" rx="5" fill="#0F2D4A"/>
  <text x="153" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#AED6F1">Drive commands IN</text>
  <text x="153" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8">I2C → Arduino Uno → L293D → small yellow DC motors</text>
  <text x="153" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8">Servo → Arm (0-180 deg)</text>

  <rect x="34" y="568" width="238" height="82" rx="5" fill="#0F2D4A"/>
  <text x="153" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#AED6F1">Audio stream IN</text>
  <text x="153" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8">I2S → MAX98357A amp → Speaker</text>
  <text x="153" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7EB9D8">44.1kHz · received in 1KB chunks</text>

  <text x="153" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6090B0" font-style="italic">esp32_motor_and_audio_out.ino</text>

  <!-- Blue arrows SW to HW -->
  <line x1="556" y1="519" x2="283" y2="519" stroke="#1565C0" stroke-width="2.5" marker-end="url(#mo)"/>
  <text x="425" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B3000">Drive instructions</text>
  <text x="425" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9B6030">speed + arm angle · 4Hz</text>

  <line x1="556" y1="609" x2="283" y2="609" stroke="#1565C0" stroke-width="2.5" marker-end="url(#mo)"/>
  <text x="425" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B3000">Audio to play on speaker</text>
  <text x="425" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9B6030">sound file · streamed on demand</text>

  <!-- SW output boxes -->
  <rect x="566" y="483" width="222" height="72" rx="8" fill="#7B3800"/>
  <text x="677" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Sends drive commands</text>
  <text x="677" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFDFA0">Arbitrates manual vs. brain control</text>

  <rect x="566" y="573" width="222" height="72" rx="8" fill="#7B3800"/>
  <text x="677" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Plays audio on speaker</text>
  <text x="677" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFDFA0">Streams sound files to the robot</text>

  <!-- =========================================================== -->
  <!-- OUTPUT FAN-OUT: OUTPUT section fans to 2 SW boxes            -->
  <!-- =========================================================== -->
  <line x1="869" y1="555" x2="826" y2="555" stroke="#7B3800" stroke-width="1.5"/>
  <line x1="826" y1="519" x2="826" y2="609" stroke="#7B3800" stroke-width="1.5"/>
  <circle cx="826" cy="519" r="3.5" fill="#7B3800"/>
  <circle cx="826" cy="609" r="3.5" fill="#7B3800"/>
  <line x1="826" y1="519" x2="789" y2="519" stroke="#7B3800" stroke-width="2" marker-end="url(#mb)"/>
  <line x1="826" y1="609" x2="789" y2="609" stroke="#7B3800" stroke-width="2" marker-end="url(#mb)"/>

  <!-- =========================================================== -->
  <!-- PIPELINE BOX                                                  -->
  <!-- =========================================================== -->
  <rect x="869" y="116" width="455" height="500" rx="10" fill="white" stroke="#7040A0" stroke-width="2"/>

  <rect x="869" y="116" width="455" height="32" rx="8" fill="#4A1080"/>
  <text x="1096" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Pipeline</text>

  <!-- STAGING section -->
  <rect x="871" y="148" width="451" height="26" rx="4" fill="#1A5F7A"/>
  <text x="1096" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">STAGING</text>

  <text x="884" y="188" font-family="Arial, sans-serif" font-size="10" fill="#333">Four streams arrive independently, in parallel threads</text>
  <text x="884" y="206" font-family="Arial, sans-serif" font-size="10" fill="#333">Video frames are the clock — every 12 frames fires a chunk</text>
  <text x="884" y="226" font-family="Arial, sans-serif" font-size="10" fill="#1A5F7A" font-weight="bold">Per chunk (approx. 3 seconds of data):</text>
  <text x="896" y="244" font-family="Arial, sans-serif" font-size="10" fill="#555">Audio  →  12 x 4000 samples  (3s of sound)</text>
  <text x="896" y="260" font-family="Arial, sans-serif" font-size="10" fill="#555">IMU    →  readings filtered to the video time window</text>
  <text x="896" y="276" font-family="Arial, sans-serif" font-size="10" fill="#555">Motor  →  last 12 logged states  (FIFO)</text>
  <text x="896" y="292" font-family="Arial, sans-serif" font-size="10" fill="#555">Video  →  12 frames at 640x640</text>
  <text x="884" y="312" font-family="Arial, sans-serif" font-size="10" fill="#333">All four streams synchronised and packaged together</text>

  <line x1="879" y1="324" x2="1316" y2="324" stroke="#CCC" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- PROCESSING section -->
  <rect x="871" y="328" width="451" height="26" rx="4" fill="#2E7D32"/>
  <text x="1096" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">PROCESSING</text>

  <text x="896" y="368" font-family="Arial, sans-serif" font-size="10" fill="#333">1.  Detect cat in the video frame</text>
  <text x="896" y="386" font-family="Arial, sans-serif" font-size="10" fill="#333">2.  Classify the sound  (meow vs. background noise)</text>
  <text x="896" y="404" font-family="Arial, sans-serif" font-size="10" fill="#333">3.  Analyse movement &amp; balance from the IMU</text>
  <text x="896" y="422" font-family="Arial, sans-serif" font-size="10" fill="#333">4.  Combine into a 12-frame experience snapshot</text>
  <text x="896" y="440" font-family="Arial, sans-serif" font-size="10" fill="#333">5.  Apply decision rules → choose an action</text>
  <text x="896" y="458" font-family="Arial, sans-serif" font-size="10" fill="#333">6.  Generate a motor command sequence</text>
  <text x="896" y="476" font-family="Arial, sans-serif" font-size="10" fill="#777" font-style="italic">    runs every ~3s · LLM reflection layer every ~20s</text>

  <line x1="879" y1="490" x2="1316" y2="490" stroke="#CCC" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- OUTPUT section -->
  <rect x="871" y="494" width="451" height="26" rx="4" fill="#7B3800"/>
  <text x="1096" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">OUTPUT</text>

  <text x="884" y="534" font-family="Arial, sans-serif" font-size="10" fill="#333">Motor commands → queued → sent one-by-one at 4Hz</text>
  <text x="884" y="552" font-family="Arial, sans-serif" font-size="10" fill="#333">Audio playback → file loaded → streamed in 1KB chunks</text>
  <text x="884" y="574" font-family="Arial, sans-serif" font-size="10" fill="#777" font-style="italic">Both flow back through the software layer →</text>
  <text x="884" y="590" font-family="Arial, sans-serif" font-size="10" fill="#777" font-style="italic">across the network divide → to Motors ESP32</text>

  <!-- =========================================================== -->
  <!-- LEGEND                                                        -->
  <!-- =========================================================== -->
  <rect x="12" y="694" width="282" height="82" rx="8" fill="#E4EEF8" stroke="#8BADD0" stroke-width="1"/>
  <text x="153" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E4D7B">Legend</text>
  <line x1="28" y1="727" x2="72" y2="727" stroke="#D4680A" stroke-width="2.5" marker-end="url(#mi)"/>
  <text x="80" y="731" font-family="Arial, sans-serif" font-size="10" fill="#333">Sensor data: Hardware to Software</text>
  <line x1="28" y1="747" x2="72" y2="747" stroke="#1565C0" stroke-width="2.5" marker-end="url(#mo)"/>
  <text x="80" y="751" font-family="Arial, sans-serif" font-size="10" fill="#333">Commands: Software to Hardware</text>
  <rect x="28" y="760" width="12" height="12" rx="2" fill="#1B5E20"/>
  <text x="46" y="771" font-family="Arial, sans-serif" font-size="10" fill="#333">Input stream function</text>
  <rect x="155" y="760" width="12" height="12" rx="2" fill="#7B3800"/>
  <text x="173" y="771" font-family="Arial, sans-serif" font-size="10" fill="#333">Output stream function</text>

</svg>
